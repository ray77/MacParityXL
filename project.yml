name: MacParity

options:
  bundleIdPrefix: org.noisebay
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH[config=Debug]: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ParityKit:
    path: Packages/ParityKit

targets:
  MacParity:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
      - path: Vendor/build/bin/par2
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
        attributes: [CodeSignOnCopy]
      - path: Vendor/build/licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: ParityKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: MacParity
        CFBundleDisplayName: MacParity
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, fr, es, uk]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "MacParity – PAR/PAR2 and RAR utility"
        NSAppleEventsUsageDescription: MacParity runs post-processing commands in Terminal.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PAR2 Set
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [org.parchive.par2]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).Par2Document
          - CFBundleTypeName: PAR Set
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [org.parchive.par]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).Par1Document
          - CFBundleTypeName: RAR Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rarlab.rar-archive]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).UnrarDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.parchive.par2
            UTTypeDescription: PAR2 Parity File
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [par2]
          - UTTypeIdentifier: org.parchive.par
            UTTypeDescription: PAR Parity File
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [par]
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [rar]
              public.mime-type: [application/x-rar-compressed, application/vnd.rar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.noisebay.MacParity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: MacParity
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/App/CUnrar
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/build/include/unrar
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/build/lib
        OTHER_LDFLAGS: -lunrar -lc++
    preBuildScripts:
      - name: Check vendored engines
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -x "$SRCROOT/Vendor/build/bin/par2" ] || [ ! -f "$SRCROOT/Vendor/build/lib/libunrar.a" ]; then
            echo "error: Vendored engines missing. Run Scripts/bootstrap-vendor.sh first."
            exit 1
          fi

  MacParityTests:
    type: bundle.unit-test
    platform: macOS
    sources: [App/Tests]
    dependencies:
      - target: MacParity
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MacParity.app/Contents/MacOS/MacParity
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  MacParity:
    build:
      targets:
        MacParity: all
        MacParityTests: [test]
    test:
      targets:
        - MacParityTests
        - package: ParityKit/ParityKitTests
